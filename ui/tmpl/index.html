{{ template "partials/header.html" }}

<div class="container text-center">

  <div class="row">
    <div class="col col-md-8">
      {{ template "partials/sessionbar.html" .Session }}
    </div>
    <div class="col col-sm-3">
      <form
        hx-post="/session"
        hx-trigger="keyup[key==='Enter']"
        hx-swap="none"
        hx-on::after-request="if(event.detail.successful) this.reset()"
        onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); }">
        <div class="spinner-border spinner-border-sm htmx-indicator" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>

        <div>
          <input type="text" class="form-control form-control-sm" placeholder="new session" name="session" />
        </div>
      </form>
    </div>

  </div>
    
  <div class="row">
    <div
      class="col md:justify-content-center d-grid gap-3"
      id="dialog"
      hx-ext="ws"
      ws-connect="/session/{{ .Session }}/context"
      hx-on:htmx:wsAfterMessage="document.getElementById('fieldTextarea').scrollIntoView()"
    >
    </div>
  </div>

  <div class="row">
    <div class="col">
      <form
        hx-post="/prompt"
        hx-target="#dialog"
        hx-trigger="keyup[key==='Enter'&&!shiftKey]"
        hx-swap="none"
        hx-on::before-request="if(event.detail.successful) document.getElementById('fieldTextarea').readOnly = true"
        hx-on::after-request="if(event.detail.successful) this.reset()"
        onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); }">
        <div class="spinner-border spinner-border-sm htmx-indicator" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>

        <div class="form-floating">
          <textarea class="form-control" id="fieldTextarea" rows="3" name="prompt"></textarea>
          <label for="fieldTextarea">Please insert any additional context here...</label>
        </div>

        <input type="hidden" name="session" value="{{ .Session }}"/>
        <input type="hidden" name="model" value="ollama" />
      </form>
    </div>
  </div>
</div>

{{ template "partials/footer.html" }}
