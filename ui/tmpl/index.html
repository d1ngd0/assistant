{{ template "partials/header.html" }}

<div class="container text-center">
  <div class="row md:justify-content-center" id="dialog" hx-ext="ws" ws-connect="/session/default/context">
  </div>
  <div class="row">
    <div class="col">
      <form
        hx-post="/prompt"
        hx-target="#dialog"
         hx-trigger="keyup[key==='Enter'&&ctrlKey]"
        hx-swap="none"
        hx-on::after-request="if(event.detail.successful) this.reset()"
      >
        <div class="form-field">
          <label for="fieldTextarea" class="form-label">Prompt</label>
          <textarea class="form-control" id="fieldTextarea" rows="3" name="prompt"></textarea>
        </div>

        <input type="hidden" name="session" value="default"/>
        <input type="hidden" name="model" value="noop" />
      </form>
    </div>
  </div>
</div>

{{ template "partials/footer.html" }}
